<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Halloween</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="script.js" type="module"></script>
</head>

<body>
    <header>
        <h1>TRIVIAL HALLOWEEN</h1>
    </header>

    <form action="post">
        <label for="nombre-grupo">Nombre del grupo</label>
        <input type="text" name="nombre-grupo" id="input-nombre">

        <label for="numero-integrantes">¿Cuántos integrantes tiene el grupo?</label>
        <select name="numero-integrantes" id="numero-integrantes">
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>

        <label for="integrante-1">Nombre / Instagram primer integrante</label>
        <input type="text" name="integrante-1" id="integrante-1" placeholder="INTRODUCE TU NOMBRE O IG">
        <label for="integrante-2">Nombre / Instagram segundo integrante</label>
        <input type="text" name="integrante-2" id="integrante-2" placeholder="INTRODUCE TU NOMBRE O IG">
        <label for="integrante-3">Nombre / Instagram tercero integrante</label>
        <input type="text" name="integrante-3" id="integrante-3" placeholder="INTRODUCE TU NOMBRE O IG">
        <label for="integrante-4">Nombre / Instagram cuarto integrante</label>
        <input type="text" name="integrante-4" id="integrante-4" placeholder="INTRODUCE TU NOMBRE O IG">
        
        <button submit="empezar" id="empezar">EMPEZAR JUEGO</button>

    </form>

</body>
</html>
