<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Halloween</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="./js/script.js" type="module"></script>
</head>

<body>

    <header>
        <h1>TRIVIAL HALLOWEEN</h1>
    </header>

    <section id="pantallaRegistro"></section>

        <form>
            <label for="nombre-grupo">Nombre del grupo</label>
            <input type="text" name="nombre-grupo" id="grupo">

            <label for="numero-integrantes">¿Cuántos integrantes tiene el grupo?</label>
            <select name="numero-integrantes" id="numero-integrantes">
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>

            <div id="contenedor-integrantes"></div>
            
            <button id="empezar">EMPEZAR JUEGO</button>

        </form>
    </section>
    
</body>
</html>
